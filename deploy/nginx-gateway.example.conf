# 公司统一网关 / 边缘 nginx 的 HTTPS 反代示例。
#
# 流量路径：浏览器 ──HTTPS:443──> 本网关 ──HTTP──> 127.0.0.1:3000（前端容器内 nginx）
#                                                        └─ /api 再转 backend:8000
# compose 已把前端端口绑在回环地址，后端不直接暴露；TLS 在本网关终止。
# 把 tcg.example.com 换成实际域名，证书路径换成实际路径后 include 进 nginx.conf。

server {
    listen 443 ssl;
    http2 on;
    server_name tcg.example.com;

    ssl_certificate     /etc/nginx/certs/tcg.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/tcg.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # PRD / Excel 上传
    client_max_body_size 50m;

    # SSE 生成流必须放在通用 / 之前优先匹配：关缓冲、HTTP/1.1、清 Connection、
    # 放大读超时，否则长生成会被网关默认 60s 超时或缓冲卡住。
    location ^~ /api/v1/generate/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余页面与普通 API 全部交给前端容器（其内部 nginx 已对 /api 设过 SSE 参数）。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;   # 评审/补全等非流式大调用
    }
}

# 可选：80 跳 443
server {
    listen 80;
    server_name tcg.example.com;
    return 301 https://$host$request_uri;
}
