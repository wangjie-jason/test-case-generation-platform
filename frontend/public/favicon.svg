  <!-- 文档折角 -->
  <path d="M40 14 v6 a2 2 0 0 0 2 2 h6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 清单条目 -->
  <line x1="24" y1="30" x2="36" y2="30" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="42" y2="38" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- 大对勾 -->
  <path d="M25 46 l5 5 l12 -12"
        fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
